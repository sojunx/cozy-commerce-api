name: CI/CD Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup docker builder
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST_NAME: ${{ secrets.HOSTNAME }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $HOST_NAME >> ~/.ssh/known_hosts

      - name: Login GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOST_NAME: ${{ secrets.HOSTNAME }}
        run: |
          echo "$GHCR_TOKEN" | ssh deploy@"$HOST_NAME" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Deploy
        env:
          HOST_NAME: ${{ secrets.HOSTNAME }}
          DEPLOY_DIR: /opt/cozy-commerce-api
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA::7}"
          ssh deploy@"$HOST_NAME" "IMAGE_TAG=$IMAGE_TAG DEPLOY_DIR=$DEPLOY_DIR bash -s" << 'EOF'
            set -euo pipefail
            cd "$DEPLOY_DIR"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
          EOF